[project]
name = "agenticai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "madhu967", email = "ijjimadhu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.4",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agenticai = "agenticai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
